; Configuração de runtime do NEXUS-FIELD no container da Vercel.
; Nada aqui contém segredo: valores sensíveis vêm das variáveis de ambiente.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 120
max_input_vars = 2000

; Mesmo fuso do APP_TIMEZONE e do MySQL da operação.
date.timezone = America/Sao_Paulo

session.auto_start = 0

; O código é imutável dentro da imagem, então não há custo em desligar a
; verificação de timestamps. Cada deploy gera uma imagem nova.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
