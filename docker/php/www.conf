[www]

user = www-data
group = www-data

; O nginx roda como "nginx" na imagem Alpine; o socket precisa ser acessível
; por ele, mas nao precisa ser publico para outros processos.
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Variaveis de ambiente do container (APP_KEY, DB_*, MAIL_*) precisam chegar
; aos workers. Sem clear_env = no o PHP-FPM as descarta e o login quebra.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
